# =====================================================================
#  EcoTrace CRM — configuración base (PostgreSQL)
#  Las credenciales NO se escriben aquí: se leen de variables de entorno.
#  (El repo de referencia tenía usuario y clave de la BD en este archivo.)
# =====================================================================
spring.application.name=ecotrace
spring.profiles.active=${ECOTRACE_PROFILE:dev}
server.port=${PORT:8080}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecotrace}
spring.datasource.username=${DB_USER:ecotrace}
spring.datasource.password=${DB_PASSWORD:ecotrace}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

# --- JPA: el esquema lo crea Flyway; Hibernate sólo lo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# --- Flyway (migraciones en db/migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Sesión HTTP (login con cookie) ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=ECOTRACE_SESSION

# --- Compresión de JSON grandes (snapshot, datasets) ---
server.compression.enabled=true
server.compression.mime-types=application/json,text/csv,text/html,application/javascript,text/css
server.compression.min-response-size=2048

# --- OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Seguridad ---
# Administrador inicial: se crea sólo si la tabla de usuarios está vacía.
ecotrace.seguridad.admin.usuario=${ECOTRACE_ADMIN_USER:admin}
ecotrace.seguridad.admin.password=${ECOTRACE_ADMIN_PASSWORD:}
# Cuentas de demostración (analista y lector) y su listado en la pantalla de login.
ecotrace.seguridad.cuentas-demo=false
# Bloqueo temporal tras intentos fallidos
ecotrace.seguridad.max-intentos=5
ecotrace.seguridad.minutos-bloqueo=5
ecotrace.cors.allowed-origins=http://localhost:5173,http://localhost:5179

# --- Datos de demostración (lecturas REMMAQ/Open-Meteo al arrancar) ---
ecotrace.demo.seed=false

# --- Integraciones externas ---
ecotrace.externa.open-meteo.base-url=https://air-quality-api.open-meteo.com/v1/air-quality
ecotrace.externa.openaq.base-url=https://api.openaq.org/v3
ecotrace.externa.openaq.api-key=${OPENAQ_API_KEY:}
ecotrace.externa.timeout-ms=8000
